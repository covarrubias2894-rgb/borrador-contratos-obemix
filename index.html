<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FDFDF3">
<meta name="format-detection" content="telephone=no">
<title>Contratos · OBE! mix</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   OBE! mix · Contratos — mismos colores que su página con cotizador
   Regla: el texto va en --ink / --ink-2 sobre crema o blanco.
   ============================================================ */
:root{
  color-scheme:light;
  --crema:#FDFDF3; --papel:#FFFFFF; --ink:#17414A; --ink-2:#4F6F75; --linea:#DDEDEE;
  --turquesa:#4CC4CF; --turquesa-d:#0B7A87;
  --rosa:#F87E93;     --rosa-d:#C2405A;
  --lila:#A77BCB;     --lila-d:#7650A3;
  --dorado:#DC9F4B;   --dorado-d:#9A6312;
  --onda-rosa:#F69CD2; --onda-lila:#D2B4F2; --onda-aqua:#8DD8E5;
  --s-aqua:#EAF7F8; --s-rosa:#FFF0F3; --s-lila:#F5EFFB; --s-dorado:#FBF4E8;
  --wa:#0F7B47;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --sombra:0 12px 30px -14px rgba(23,65,74,.30),0 2px 6px rgba(23,65,74,.06);
  --sombra-s:0 6px 16px -8px rgba(23,65,74,.30);
  --f-tit:'Fredoka',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-cuerpo:'Nunito',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --pad:16px; --max:760px; --tabs-h:64px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f-cuerpo);background:var(--crema);color:var(--ink);line-height:1.45;font-size:16px;overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh}
img,svg{display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--turquesa-d);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.nb{white-space:nowrap}
.i{width:1.2em;height:1.2em;flex:none}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
.wrap.ancho{max-width:920px}

/* ---------- Cinta de borrador y encabezado ---------- */
.cinta{background:var(--lila-d);color:#fff;font-size:.8rem;font-weight:800;text-align:center;padding:7px 12px;letter-spacing:.01em}
.top{display:flex;align-items:center;gap:12px;max-width:var(--max);margin:0 auto;padding:10px var(--pad) 6px}
.top img{width:60px;height:40px;object-fit:contain}
.top h1{font-family:var(--f-tit);font-weight:600;font-size:1.25rem;line-height:1.1}
.top h1 span{color:var(--turquesa-d)}

/* ---------- Vistas ---------- */
.vista{padding:6px 0 calc(var(--tabs-h) + var(--safe-b) + 28px)}
#v-contrato{padding-bottom:calc(var(--tabs-h) + var(--safe-b) + 104px)}
.h2{font-family:var(--f-tit);font-weight:600;font-size:1.3rem;margin:28px 0 10px;line-height:1.15}
.ayuda{font-size:.84rem;color:var(--ink-2);font-weight:600;margin-top:6px}
.msg-err{font-size:.86rem;font-weight:800;color:var(--rosa-d);margin-top:6px}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:48px;padding:.75rem 1.3rem;border-radius:999px;font-family:var(--f-tit);font-weight:600;font-size:1.02rem;letter-spacing:.01em;text-align:center;box-shadow:0 6px 14px -8px var(--sh,rgba(23,65,74,.6)),inset 0 -2px 0 rgba(0,0,0,.14);transition:transform .12s}
.btn:active{transform:translateY(2px)}
.btn svg{width:20px;height:20px;flex:none}
.btn-turquesa{background:var(--turquesa-d);color:#fff;--sh:rgba(11,122,135,.9)}
.btn-lila{background:var(--lila-d);color:#fff;--sh:rgba(118,80,163,.9)}
.btn-wa{background:var(--wa);color:#fff;--sh:rgba(15,123,71,.9)}
.btn-rosa{background:var(--rosa-d);color:#fff;--sh:rgba(194,64,90,.9)}
.btn-linea{background:var(--papel);color:var(--ink);box-shadow:inset 0 0 0 2px var(--turquesa-d)}
.btn-bloque{width:100%}
.btn-chico{min-height:44px;padding:.45rem 1rem;font-size:.92rem}
.lnk{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:800;color:var(--turquesa-d);text-decoration:underline;text-underline-offset:3px}

/* ---------- Inicio ---------- */
.grande{display:flex;align-items:center;gap:14px;width:100%;min-height:86px;padding:16px;border-radius:var(--r-lg);text-align:left;box-shadow:var(--sombra);margin-top:12px;transition:transform .12s}
.grande:active{transform:scale(.99)}
.grande .gi{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
.grande .gi svg{width:28px;height:28px}
.grande b{display:block;font-family:var(--f-tit);font-size:1.25rem;font-weight:600;line-height:1.15}
.grande small{display:block;font-size:.9rem;font-weight:700;opacity:.92;margin-top:2px}
.g-turq{background:var(--turquesa-d);color:#fff}
.g-turq .gi{background:rgba(255,255,255,.18)}
.g-papel{background:var(--papel);color:var(--ink);box-shadow:inset 0 0 0 2px var(--turquesa-d),var(--sombra-s)}
.g-papel .gi{background:#E4F4EC;color:var(--wa)}
.nota-priv{display:flex;gap:8px;align-items:flex-start;font-size:.84rem;font-weight:700;color:var(--ink-2);margin-top:14px}
.nota-priv svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--turquesa-d)}
.aviso{border-radius:var(--r-md);padding:.7rem .9rem;font-weight:700;font-size:.9rem;margin-top:12px;line-height:1.35}
.aviso-lila{background:var(--s-lila);box-shadow:inset 0 0 0 2px var(--onda-lila)}
.aviso-dorado{background:var(--s-dorado);box-shadow:inset 0 0 0 2px var(--dorado)}
.aviso-rosa{background:var(--s-rosa);box-shadow:inset 0 0 0 2px var(--rosa)}
.aviso-aqua{background:var(--s-aqua);box-shadow:inset 0 0 0 2px var(--turquesa)}
.aviso .fila{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.aviso .fila button{min-height:44px;padding:0 16px;border-radius:999px;font-weight:800;background:var(--papel);box-shadow:inset 0 0 0 2px var(--ink-2)}
.aviso .fila button.si{background:var(--rosa-d);color:#fff;box-shadow:none}
.en-curso{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--s-aqua);box-shadow:inset 0 0 0 2px var(--turquesa);width:100%;text-align:left;min-height:56px}
.en-curso b{display:block;font-weight:800}
.en-curso small{display:block;font-size:.84rem;color:var(--ink-2);font-weight:700}
.en-curso svg{width:22px;height:22px;flex:none;margin-left:auto;color:var(--turquesa-d)}
.ejemplo{margin-top:12px}
.buscar{position:relative}
.buscar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--ink-2);pointer-events:none}
.buscar .inp{padding-left:44px}
.hist{list-style:none;display:grid;gap:10px;margin-top:12px}
.hi{background:var(--papel);border-radius:var(--r-md);padding:12px 12px 10px;box-shadow:inset 0 0 0 2px var(--linea)}
.hi-top{display:flex;gap:10px;align-items:flex-start}
.hdot{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none}
.hdot.prox{background:var(--turquesa)}
.hdot.pasado{background:#22A06B}
.hi-info{flex:1;min-width:0}
.hi-info b{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi-info small{display:block;color:var(--ink-2);font-weight:700;font-size:.84rem}
.hi-total{font-family:var(--f-tit);font-weight:600;white-space:nowrap}
.hi-acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.hi-acts button{min-height:44px;border-radius:12px;font-weight:800;font-size:.86rem;background:var(--s-aqua);text-align:center}
.hi-acts button.del{background:var(--s-rosa);color:var(--rosa-d)}
.hi-conf{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--s-rosa);border-radius:12px;padding:6px 10px;font-weight:800;font-size:.9rem}
.hi-conf button{min-height:44px;padding:0 14px;background:var(--papel);box-shadow:inset 0 0 0 2px var(--rosa-d)}
.hi-conf button.si{background:var(--rosa-d);color:#fff;box-shadow:none}
.vacio{background:var(--papel);border-radius:var(--r-md);padding:18px;text-align:center;color:var(--ink-2);font-weight:700;box-shadow:inset 0 0 0 2px var(--linea)}
.resp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.resp .btn{min-height:48px;padding:.6rem .8rem;font-size:.95rem}

/* ---------- Formulario ---------- */
.folio-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:4px 0 6px}
.folio-bar .fol{font-family:var(--f-tit);font-weight:600;font-size:1.15rem}
.folio-bar .tot{font-weight:800;font-size:.95rem}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:.15rem .65rem;font-weight:800;font-size:.78rem;background:var(--s-aqua);color:var(--turquesa-d);vertical-align:middle}
.pill.dorado{background:var(--s-dorado);color:var(--dorado-d)}
.pill.verde{background:#E4F4EC;color:var(--wa)}
.banner{position:relative;padding-right:52px}
.banner .x{position:absolute;right:4px;top:4px;width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.banner .x svg{width:18px;height:18px}
.sec{background:var(--papel);border-radius:var(--r-lg);box-shadow:inset 0 0 0 2px var(--linea);margin-top:10px}
.sec.falta{box-shadow:inset 0 0 0 2px var(--rosa-d);background:var(--s-rosa)}
.sec-h{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 14px;text-align:left;border-radius:var(--r-lg)}
.sec-n{width:34px;height:34px;border-radius:50%;background:var(--s-aqua);color:var(--turquesa-d);display:grid;place-items:center;font-family:var(--f-tit);font-weight:700;flex:none}
.sec-n svg{width:18px;height:18px}
.sec.ok .sec-n{background:var(--turquesa-d);color:#fff}
.sec.falta .sec-n{background:var(--rosa-d);color:#fff}
.sec-t{flex:1;min-width:0}
.sec-t b{display:block;font-family:var(--f-tit);font-weight:600;font-size:1.12rem;line-height:1.2}
.sec-t small{display:block;color:var(--ink-2);font-weight:700;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec.falta .sec-t small{color:var(--rosa-d)}
.chev{width:22px;height:22px;flex:none;transition:transform .2s;color:var(--ink-2)}
.sec-h[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sec-b{padding:2px 14px 18px}
.campo{display:block;margin-top:16px}
.campo:first-child{margin-top:2px}
.l{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-weight:800;font-size:.93rem;margin-bottom:6px}
.l small{font-weight:600;color:var(--ink-2)}
.req{color:var(--rosa-d)}
.pcot{width:10px;height:10px;border-radius:50%;background:var(--turquesa);box-shadow:0 0 0 3px #D3F0F3;display:inline-block;flex:none}
.inp{width:100%;min-height:50px;padding:.7rem .9rem;border-radius:var(--r-sm);border:2px solid #9CC7CC;background:var(--papel);color:var(--ink);font-size:16px;appearance:none;-webkit-appearance:none;display:block}
.inp:focus{border-color:var(--turquesa-d)}
.inp::placeholder{color:#6E8A8F}
.inp.err{border-color:var(--rosa-d);box-shadow:0 0 0 3px rgba(194,64,90,.2)}
textarea.inp{min-height:96px;resize:vertical;line-height:1.4}
input[type="date"].inp,input[type="time"].inp{min-width:0}
.dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.dos .campo{margin-top:16px}
.pre{position:relative}
.pre span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:800;color:var(--ink-2)}
.pre .inp{padding-left:30px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:.45rem 1rem;border-radius:999px;background:var(--papel);box-shadow:inset 0 0 0 2px var(--linea);font-weight:800;font-size:.92rem;text-align:center}
.chip[aria-pressed="true"]{background:var(--turquesa-d);color:#fff;box-shadow:none}
.stepper{display:flex;align-items:center;gap:10px}
.sb{width:52px;height:52px;border-radius:50%;background:var(--turquesa-d);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),var(--sombra-s);display:grid;place-items:center;flex:none}
.sb svg{width:22px;height:22px}
.sb:disabled{opacity:.35;box-shadow:none}
.sb.chico{width:44px;height:44px}
.inp.big{text-align:center;font-family:var(--f-tit);font-weight:700;font-size:1.6rem;min-height:54px;max-width:120px;font-variant-numeric:tabular-nums}
.vivo{margin-top:10px;background:var(--s-dorado);border-radius:var(--r-md);padding:.6rem .85rem;font-weight:700;font-size:.92rem;box-shadow:inset 0 0 0 2px var(--dorado)}
.vivo b{color:var(--dorado-d)}

/* Servicio */
.paq{border-radius:var(--r-md);padding:14px;background:var(--s-dorado);box-shadow:inset 0 0 0 2px var(--dorado);text-align:center}
.paq small{display:block;font-weight:800;color:var(--ink-2);font-size:.85rem;text-transform:uppercase;letter-spacing:.06em}
.paq .pn{display:block;font-family:var(--f-tit);font-weight:700;font-size:1.5rem;line-height:1.15;margin-top:2px}
.paq .pp{display:block;font-family:var(--f-tit);font-weight:700;font-size:2.1rem;line-height:1.1;color:var(--dorado-d)}
.paq.vacio-p{background:var(--papel);box-shadow:inset 0 0 0 2px var(--linea)}
.sub{font-family:var(--f-tit);font-weight:600;font-size:1.08rem;margin:20px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cnt{display:inline-flex;align-items:baseline;gap:4px;margin-left:auto;font-family:var(--f-tit);font-weight:600;font-size:1rem}
.cnt b{font-size:1.6rem;color:var(--turquesa-d);line-height:1}
.cnt.lleno b{color:var(--dorado-d)}
.cat-g{margin-top:12px}
.cat-g h4{display:flex;align-items:center;gap:8px;font-family:var(--f-tit);font-weight:600;font-size:1rem;margin-bottom:8px}
.cat-g h4 i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block}
.tchip{min-height:44px;padding:.3rem .85rem .3rem .65rem;border-radius:999px;background:var(--papel);box-shadow:inset 0 0 0 2px var(--linea);font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;gap:7px;text-align:left}
.tchip svg{width:16px;height:16px;flex:none;color:var(--cd)}
.tchip .pdot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--c)}
.tchip[aria-pressed="true"]{background:var(--cl);box-shadow:inset 0 0 0 2px var(--cd);font-weight:800}
.tchip[aria-disabled="true"]{opacity:.5}
.c-aqua{--c:var(--onda-aqua);--cl:#E3F6F9;--cd:#2C9FB0}
.c-rosa{--c:var(--rosa);--cl:#FFE6EB;--cd:var(--rosa-d)}
.c-dorado{--c:var(--dorado);--cl:#FBEEDB;--cd:var(--dorado-d)}
.c-lila{--c:var(--lila);--cl:#EFE6F7;--cd:var(--lila-d)}
.c-turquesa{--c:var(--turquesa);--cl:#DDF4F6;--cd:var(--turquesa-d)}
.ex{background:var(--papel);border-radius:var(--r-md);padding:12px 14px;box-shadow:inset 0 0 0 2px var(--linea);margin-top:10px}
.ex.on{background:var(--s-aqua);box-shadow:inset 0 0 0 2px var(--turquesa-d)}
.ex-fila{display:flex;align-items:center;gap:12px;min-height:52px;flex-wrap:wrap}
.ex .tx{flex:1;min-width:150px}
.ex b{display:block;font-family:var(--f-tit);font-weight:600;font-size:1.05rem;line-height:1.2}
.ex .d{display:block;font-size:.84rem;color:var(--ink-2);font-weight:600}
.ex .n{min-width:28px;text-align:center;font-family:var(--f-tit);font-weight:700;font-size:1.3rem}
.ex .campo{margin-top:12px}
.sw{position:relative;width:62px;height:36px;flex:none;border-radius:99px;background:#B9C9CC;transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--turquesa-d)}
.sw[aria-checked="true"]::after{transform:translateX(26px)}
.sw-wrap{min-width:62px;min-height:44px;display:grid;place-items:center;flex:none}
.sw-fila{display:flex;align-items:center;gap:12px;min-height:56px;margin-top:8px}
.sw-fila .tx{flex:1;min-width:0;font-weight:800}
.sw-fila .tx small{display:block;font-weight:600;color:var(--ink-2);font-size:.84rem}

/* Pagos */
.tarjetas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tj{border-radius:12px;padding:9px 6px 8px;text-align:center;border:1.5px solid}
.tj small{display:block;font-size:.64rem;font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1.15;min-height:2.3em}
.tj b{display:block;font-family:var(--f-tit);font-weight:600;font-size:1.12rem;color:#0F172A;margin-top:4px;line-height:1.1}
.tj span{display:block;font-size:.7rem;color:#64748B;font-weight:700;line-height:1.2;margin-top:4px}
.tj .ok{color:#14532D}
.tj1{background:#F0FDF4;border-color:#86EFAC}
.tj1 small{color:#14532D}
.tj2,.tj3{background:#FAF5FF;border-color:#F0ABFC}
.tj2 small,.tj3 small{color:#701A75}
.ajuste{margin-top:12px;background:var(--s-lila);border-radius:var(--r-md);padding:12px;box-shadow:inset 0 0 0 2px var(--onda-lila)}
.ajuste .campo:first-child{margin-top:0}

/* Cláusulas */
.cl{border-radius:var(--r-md);padding:12px;box-shadow:inset 0 0 0 2px var(--linea);background:var(--papel);margin-top:10px}
.cl.on{box-shadow:inset 0 0 0 2px var(--turquesa)}
.cl.orig{background:#F8FAFC}
.cl.mal{box-shadow:inset 0 0 0 2px var(--rosa-d)}
.cl-top{display:flex;gap:10px;align-items:flex-start}
.cl-t{flex:1;min-width:0}
.cl-t b{display:block;font-weight:800;line-height:1.25}
.etq{display:inline-block;border-radius:999px;padding:.05rem .55rem;font-size:.74rem;font-weight:800;margin:4px 6px 0 0}
.etq-original{background:#E8EDF3;color:#475569}
.etq-sugerida{background:#D6F1F3;color:var(--turquesa-d)}
.etq-porConfirmar{background:#F8E7C9;color:var(--dorado-d)}
.cl-donde{display:inline-block;font-size:.78rem;color:var(--ink-2);font-weight:700}
.cl-txt{font-size:.88rem;color:var(--ink-2);margin-top:6px;line-height:1.4}
.cl.orig .cl-txt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cl-txt mark{background:#FBE3B4;color:var(--ink);border-radius:4px;padding:0 3px;font-weight:800}
.candado{font-size:.76rem;font-weight:800;color:#64748B;display:flex;align-items:center;gap:4px;min-height:44px;flex:none}
.candado svg{width:16px;height:16px}
.cl-datos{margin-top:10px;padding-top:6px;border-top:2px dashed var(--linea)}
.cl-datos .campo{margin-top:10px}
.cl-guarda{font-size:.78rem;font-weight:700;color:var(--ink-2);margin-top:8px}
.leyenda{font-size:.84rem;color:var(--ink-2);font-weight:700;margin-bottom:4px}

/* Botón fijo "Ver contrato" */
.accion-fija{position:fixed;left:0;right:0;bottom:calc(var(--tabs-h) + var(--safe-b));z-index:35;padding:16px var(--pad) 10px;background:linear-gradient(rgba(253,253,243,0),var(--crema) 38%);pointer-events:none}
.accion-fija .btn{pointer-events:auto;max-width:calc(var(--max) - 2*var(--pad));margin:0 auto;display:flex}

/* ---------- Vista previa ---------- */
.pv-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}
.pv-top .fol{font-family:var(--f-tit);font-weight:600;font-size:1.1rem}
.seg{display:inline-flex;background:var(--papel);border-radius:999px;box-shadow:inset 0 0 0 2px var(--linea);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 12px;border-radius:999px;font-weight:800;font-size:.84rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--turquesa-d);color:#fff}
.hojas-wrap{overflow:auto;border-radius:14px;background:#E3E9EB;padding:10px;-webkit-overflow-scrolling:touch;margin-top:10px}
.hojas{display:grid;gap:12px;width:100%;max-width:820px;margin:0 auto}
.hojas.zoom{width:240%;max-width:none}
.pagina{background:#fff;box-shadow:0 4px 14px rgba(23,65,74,.18);border-radius:2px;cursor:zoom-in}
.hojas.zoom .pagina{cursor:zoom-out}
.pagina svg{display:block;width:100%;height:auto}
.pagina text{font-family:"NotoSansContrato",Helvetica,Arial,sans-serif;white-space:pre;font-kerning:none;font-variant-ligatures:none}
.leyenda-rev{line-height:1.9}
.leyenda-rev .ley-nuevo{color:#7C3AED;background:#EDE9FE;box-shadow:inset 0 0 0 1px #C4B5FD;border-radius:999px;padding:.05rem .55rem;white-space:nowrap}
.leyenda-rev .ley-falta{color:#713F12;background:#FEF08A;border-radius:4px;padding:.05rem .4rem;white-space:nowrap}
.pv-nota{font-size:.8rem;color:var(--ink-2);font-weight:700;text-align:center;margin-top:8px}
.acciones{display:grid;gap:10px;margin-top:16px}
.fab{position:fixed;right:16px;bottom:calc(var(--tabs-h) + var(--safe-b) + 14px);z-index:36;box-shadow:0 10px 24px -8px rgba(11,122,135,.9),inset 0 -2px 0 rgba(0,0,0,.14)}

/* ---------- Pestañas inferiores ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);border-top:2px solid var(--linea);padding-bottom:var(--safe-b)}
.tabs-in{display:flex;max-width:var(--max);margin:0 auto}
.tab{flex:1;min-height:var(--tabs-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:.8rem;color:var(--ink-2);text-align:center}
.tab .ti{padding:3px 18px;border-radius:999px;display:grid;place-items:center;transition:background .15s}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--turquesa-d)}
.tab[aria-selected="true"] .ti{background:var(--s-aqua)}
@media (pointer:coarse){ body.teclado .tabs,body.teclado .accion-fija,body.teclado .fab{display:none} }

/* ---------- Hoja inferior (pegar cotización) ---------- */
.velo{position:fixed;inset:0;background:rgba(23,65,74,.5);z-index:70}
.hoja-inf{position:fixed;left:0;right:0;bottom:0;z-index:71;background:var(--crema);border-radius:24px 24px 0 0;padding:10px var(--pad) calc(16px + var(--safe-b));max-height:92vh;overflow:auto;max-width:640px;margin:0 auto;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.agarre{width:44px;height:5px;border-radius:9px;background:#C3D2D5;margin:0 auto 8px}
.hoja-inf h2{font-family:var(--f-tit);font-weight:600;font-size:1.3rem;padding-right:48px}
.hoja-inf .x{position:absolute;right:10px;top:10px;width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.hoja-inf .x svg{width:20px;height:20px}
.hoja-inf textarea.inp{min-height:200px;margin-top:10px;font-size:16px}
.hoja-btns{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:10px}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--tabs-h) + var(--safe-b) + 84px);transform:translate(-50%,16px);z-index:90;background:var(--ink);color:#fff;border-radius:var(--r-md);padding:.75rem 1rem;font-weight:700;font-size:.92rem;width:max-content;max-width:min(92vw,440px);box-shadow:var(--sombra);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;display:flex;align-items:center;gap:10px;line-height:1.35}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{min-height:44px;padding:0 14px;border-radius:999px;background:var(--dorado);color:var(--ink);font-weight:800;flex:none}

@media (min-width:700px){
  .top h1{font-size:1.4rem}
  .hojas.zoom{width:170%}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

function normalizarContrato(o){
  if (!o || typeof o !== "object") return null;
  const str = (v, n) => String(v == null ? "" : v).slice(0, n);
  const k = contratoNuevo(typeof o.folio === "string" && o.folio.trim() ? o.folio.trim().slice(0, 30) : "");
  if (!k.folio) return null;
  if (typeof o.id === "string" && o.id) k.id = o.id.slice(0, 40);
  k.folioCotizacion = str(o.folioCotizacion, 40);
  ["creado", "actualizado"].forEach(f => { if (typeof o[f] === "string" && !isNaN(Date.parse(o[f]))) k[f] = o[f]; });
  k.generado = !!o.generado;
  k.elaborado = fechaDe(o.elaborado) ? o.elaborado : "";
  const c = o.cliente || {};
  k.cliente = { nombre: str(c.nombre, LIM.nombre), telefono: str(c.telefono, LIM.telefono), festejado: str(c.festejado, LIM.nombre), festejadoGenero: c.festejadoGenero === "a" || c.festejadoGenero === "o" ? c.festejadoGenero : "" };
  const e = o.evento || {};
  k.evento.tipo = EVENTOS.indexOf(e.tipo) >= 0 ? e.tipo : "";
  k.evento.tipoOtro = str(e.tipoOtro, 40);
  k.evento.fecha = fechaDe(e.fecha) ? e.fecha : "";
  k.evento.hora = /^\d{1,2}:\d{2}$/.test(String(e.hora || "")) ? e.hora : "";
  k.evento.direccion = str(e.direccion, LIM.direccion);
  k.evento.contactoNombre = str(e.contactoNombre, LIM.nombre);
  k.evento.contactoTel = str(e.contactoTel, LIM.telefono);
  k.evento.invitados = e.invitados == null || e.invitados === "" ? null : clampInt(e.invitados, REGLAS.minInvitados, TOPE_INVITADOS, null);
  k.evento.notas = str(e.notas, LIM.notas);
  k.precioEspecial = str(o.precioEspecial, LIM.dinero);
  if (Array.isArray(o.snacks)) k.snacks = o.snacks.filter((id, i, a) => productoPorId(id) && a.indexOf(id) === i).slice(0, REGLAS.productosPorBarra);
  EXTRAS.forEach(x => {
    const s = (o.extras || {})[x.id] || {};
    k.extras[x.id] = { cant: x.cobro === "por hora" ? clampInt(s.cant, 0, x.max || 1, 0) : (s.cant ? 1 : 0), monto: str(s.monto, LIM.dinero), tema: str(s.tema, LIM.tema), cantidad: str(s.cantidad, 5) };
  });
  const a = o.ajuste || {};
  k.ajuste = { on: !!a.on, total: str(a.total, LIM.dinero), nota: str(a.nota, LIM.nota) };
  const p = o.pago || {};
  k.pago = { pagado: !!p.pagado, fecha: fechaDe(p.fecha) ? p.fecha : k.pago.fecha };
  if (o.clausulas && typeof o.clausulas === "object") CLAUSULAS.forEach(cl => { if (cl.tipo !== "original" && typeof o.clausulas[cl.id] === "boolean") k.clausulas[cl.id] = o.clausulas[cl.id]; });
  if (o.datos && typeof o.datos === "object") Object.keys(DATOS_CLAUSULAS).forEach(d => {
    if (d in o.datos) k.datos[d] = DATOS_CLAUSULAS[d].tipo === "casilla" ? !!o.datos[d] : str(o.datos[d], 160);
  });
  k.imagenes = o.imagenes !== false;
  const f = o.firma || {};
  k.firma = { lugar: f.lugar != null ? str(f.lugar, 60) : CONFIG.ciudad, fecha: fechaDe(f.fecha) ? f.fecha : k.firma.fecha };
  if (Array.isArray(o.deCotizacion)) k.deCotizacion = o.deCotizacion.filter(s => typeof s === "string").slice(0, 20);
  return k;
}

/* Fechas: siempre en hora local (YYYY-MM-DD) para no adelantar un día */
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const MESES_C = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const DIAS_C = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
const isoDe = d => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
const hoyISO = () => isoDe(new Date());
function fechaDe(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
  if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3], 12);
  return d.getMonth() === +m[2] - 1 ? d : null;
}
function fechaHora(iso, hhmm){
  const d = fechaDe(iso), m = /^(\d{1,2}):(\d{2})/.exec(String(hhmm || ""));
  if (!d || !m) return null;
  d.setHours(+m[1], +m[2], 0, 0);
  return d;
}
/* "sábado 14 de noviembre de 2026" */
function fechaLarga(iso){
  const d = fechaDe(iso);
  return d ? d.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).replace(/^([^\s,]+),\s*/, "$1 ") : "";
}
/* "14 de noviembre de 2026" */
function fechaSinDia(iso){ const d = fechaDe(iso); return d ? d.getDate() + " de " + MESES[d.getMonth()] + " de " + d.getFullYear() : ""; }
/* "10/10/2026" */
function fechaCorta(iso){ const d = fechaDe(iso); return d ? pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + "/" + d.getFullYear() : ""; }
/* "sáb 14 nov 2026" (historial) */
function fechaBreve(iso){ const d = fechaDe(iso); return d ? DIAS_C[d.getDay()] + " " + d.getDate() + " " + MESES_C[d.getMonth()] + " " + d.getFullYear() : ""; }
/* "5:00 p. m." */
function horaTxt(d){ const h = d.getHours(); return ((h % 12) || 12) + ":" + pad2(d.getMinutes()) + (h < 12 ? " a. m." : " p. m."); }   // espacios que no se parten

/* Teléfonos: se muestran como 222 123 4567; para WhatsApp se antepone 52 */
function telCorto(n){ const d = digitos(n).slice(-10); return d.length === 10 ? d.slice(0, 3) + " " + d.slice(3, 6) + " " + d.slice(6) : digitos(n); }
function limpiarTel(s){ const d = digitos(s); if (d.length === 10) return "52" + d; if (d.length === 12 && d.indexOf("52") === 0) return d; if (d.length === 13 && d.indexOf("521") === 0) return "52" + d.slice(3); return d; }
/* Montos escritos a mano: "$3,550" → 3550; vacío → null */
function numOrNull(v){
  const s = String(v == null ? "" : v).replace(/[^\d.]/g, "");
  if (!s) return null;
  const n = Math.round(parseFloat(s));
  return isFinite(n) ? n : null;
}
/* Nombre de archivo sin acentos ni signos raros */
function sinAcentos(s){ return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9 ._-]/g, "").replace(/\s+/g, " ").trim(); }
const ruta = (o, p) => p.split(".").reduce((a, k) => (a == null ? a : a[k]), o);

const almacen = {

   CÁLCULO — una sola función pura: vista previa, PDF, WhatsApp e historial
   leen de aquí.

/* Paquete que corresponde: el primero cuyo "hasta" alcanza a los invitados; null = más del máximo */
function paquetePara(inv){ return PAQUETES.slice().sort((a, b) => a.hasta - b.hasta).find(p => p.hasta >= inv) || null; }
const MAX_PAQ = Math.max.apply(null, PAQUETES.map(p => p.hasta));

function calcular(k){
  const ev = k.evento;
  const hayInv = ev.invitados != null && ev.invitados !== "" && Number(ev.invitados) > 0;
  const invitados = hayInv ? clampInt(ev.invitados, REGLAS.minInvitados, TOPE_INVITADOS, REGLAS.minInvitados) : null;
  const paquete = invitados ? paquetePara(invitados) : null;
  const especial = !!invitados && !paquete;                       // más de 100: monto manual
  const precioPaquete = paquete ? paquete.precio : (especial ? numOrNull(k.precioEspecial) : null);

  const snacks = k.snacks.map(productoPorId).filter(Boolean);
  const grupos = CATEGORIAS.map(cat => ({ cat: cat, items: snacks.filter(p => p.cat === cat.id) })).filter(g => g.items.length);

  /* extras: con precio de la lista, o con el "monto acordado" que ella escribe */
  const extras = EXTRAS.map(x => {
    const e = k.extras[x.id] || {};
    const porHora = x.cobro === "por hora";
    const cant = porHora ? clampInt(e.cant, 0, x.max || 1, 0) : (e.cant ? 1 : 0);
    if (!cant) return null;
    const conPrecio = typeof x.precio === "number" && isFinite(x.precio);
    return {
      id: x.id, nombre: x.nombre, porHora: porHora, cant: cant, conPrecio: conPrecio,
      importe: conPrecio ? x.precio * cant : numOrNull(e.monto),
      tema: x.pideTema ? String(e.tema || "").trim() : "",
      cantidad: x.pideTema ? numOrNull(e.cantidad) : null
    };
  }).filter(Boolean);
  const extrasSuma = extras.reduce((s, e) => s + (e.importe || 0), 0);
  const extrasSinMonto = extras.filter(e => e.importe == null);

  const subtotal = precioPaquete == null || extrasSinMonto.length ? null : precioPaquete + extrasSuma;
  const ajTotal = k.ajuste.on ? numOrNull(k.ajuste.total) : null;
  const ajustado = ajTotal != null;
  const total = ajustado ? ajTotal : subtotal;
  const anticipo = total == null ? null : Math.round(total * REGLAS.anticipoPct / 100);
  const saldo = total == null ? null : total - anticipo;

  const horasExtra = extras.filter(e => e.porHora).reduce((s, e) => s + e.cant, 0);
  const horas = REGLAS.horasIncluidas + horasExtra;
  const inicio = fechaHora(ev.fecha, ev.hora);
  const termino = inicio ? new Date(inicio.getTime() + horas * 3600e3) : null;
  const dFecha = inicio ? null : fechaDe(ev.fecha);                       // sin hora de inicio: se cuenta por día
  const limite = inicio ? new Date(inicio.getTime() - REGLAS.liquidarHorasAntes * 3600e3)
               : dFecha ? new Date(dFecha.getTime() - REGLAS.liquidarHorasAntes * 3600e3) : null;
  const limiteSinHora = !inicio && !!limite;
  const tipo = ev.tipo === "Otro" ? (ev.tipoOtro.trim() || "Otro") : ev.tipo;
  const contacto = [ev.contactoNombre.trim(), digitos(ev.contactoTel) ? telCorto(ev.contactoTel) : ""].filter(Boolean).join(" · ");

  return {
    folio: k.folio, invitados, paquete, especial, precioPaquete,
    paqueteTxt: paquete ? "Paquete hasta " + paquete.hasta + " personas" : especial ? "Paquete con precio especial (más de " + MAX_PAQ + " personas)" : "",
    snacks, grupos, nSnacks: snacks.length, faltanSnacks: Math.max(0, REGLAS.productosPorBarra - snacks.length),
    extras, extrasSuma, extrasSinMonto, subtotal, ajustado, ajusteNota: String(k.ajuste.nota || "").trim(),
    total, anticipo, saldo,
    horas, horasExtra, inicio, termino, limite, limiteSinHora,
    fechaTxt: fechaLarga(ev.fecha),
    horaInicioTxt: inicio ? horaTxt(inicio) : "",
    horarioTxt: inicio ? horaTxt(inicio) + " a " + horaTxt(termino) : "",
    limiteTxt: limite ? fechaLarga(isoDe(limite)) + (limiteSinHora ? "" : ", " + horaTxt(limite)) : "",
    pagado: !!k.pago.pagado, fechaPagoTxt: fechaCorta(k.pago.fecha),
    cliente: k.cliente.nombre.trim(), telefonoTxt: digitos(k.cliente.telefono) ? telCorto(k.cliente.telefono) : "", telWa: limpiarTel(k.cliente.telefono),
    festejado: k.cliente.festejado.trim(), tipo, contacto,
    direccion: ev.direccion.trim(), notas: ev.notas.trim()
  };
}

/* Lo que falta para poder generar el PDF (los campos con *) */
function faltantes(k, c){
  const f = [], add = (sec, campo, txt) => f.push({ sec, campo, txt });
  if (!k.cliente.nombre.trim()) add("cliente", "cliente.nombre", "nombre del cliente");
  const tel = digitos(k.cliente.telefono);
  if (!tel) add("cliente", "cliente.telefono", "teléfono");
  else if (tel.length < 10) add("cliente", "cliente.telefono", "teléfono completo (10 dígitos)");
  if (!k.evento.fecha) add("evento", "evento.fecha", "fecha del evento");
  if (!k.evento.direccion.trim()) add("evento", "evento.direccion", "dirección del evento");
  if (!c.invitados) add("evento", "evento.invitados", "número de invitados");
  if (c.especial && c.precioPaquete == null) add("servicio", "precioEspecial", "precio especial del paquete");
  c.extrasSinMonto.forEach(e => add("servicio", "extras." + e.id + ".monto", e.porHora ? "monto del tiempo adicional" : "monto de los " + e.nombre.toLowerCase().split(" ")[0]));
  if (k.ajuste.on && numOrNull(k.ajuste.total) == null) add("pagos", "ajuste.total", "total ajustado");
  CLAUSULAS.forEach(cl => { if (cl.tipo !== "original" && k.clausulas[cl.id] && datosFaltantes(cl, k.datos).length) add("clausulas", "cl:" + cl.id, "datos de la cláusula “" + cl.titulo + "”"); });
  if (!String(k.firma.lugar || "").trim()) add("firma", "firma.lugar", "lugar de firma");
  if (!k.firma.fecha) add("firma", "firma.fecha", "fecha de firma");
  return f;
}

function variables(k, c){

  };

/* Llena {{variables}}: devuelve partes [{s, falta}] (lo que falta se marca, en el PDF sale "____") */
function partesTexto(t, v){
  const out = [];
  String(t).split(/(\{\{\w+\}\})/).forEach(p => {
    const m = /^\{\{(\w+)\}\}$/.exec(p);
    if (!m) { if (p) out.push({ s: p, falta: false }); return; }
    const val = v[m[1]];
    if (m[1] === "luz") { if (val) out.push({ s: val, falta: false }); return; }
    if (val == null || String(val).trim() === "") out.push({ s: "____", falta: true });
    else out.push({ s: String(val).trim(), falta: false });
  });
  return out;
}
const llenar = (t, v) => partesTexto(t, v).map(p => p.s).join("");
/* Texto de una cláusula ya con su variante elegida */
function textoDe(cl, k){
  if (cl.variantes) { const va = cl.variantes[k.datos.varianteCancel]; return va ? va.texto : ""; }
  return cl.texto;
}

/* ############################################################################
   LECTOR DE COTIZACIONES — entiende el mensaje que arma mensajeWA() en su
   página con cotizador. Tolerante: sin *, _, emojis ni [PRUEBA]; líneas en
   cualquier orden; sin importar mayúsculas ni acentos; fechas en texto o números.
   ############################################################################ */
const raiz = w => w.length > 4 ? w.replace(/(es|s)$/, "") : w.replace(/s$/, "");
const palabras = s => norm(s).replace(/[^a-z0-9ñ ]/g, " ").split(" ").filter(Boolean).map(raiz);
/* Busca un producto por nombre completo o corto ("Japonés" → "Cacahuate japonés") */
function buscarProducto(nombre, catId){
  const n = norm(nombre).replace(/[.;:!¡?¿"“”()]/g, "").trim();
  if (!n) return null;
  const buscarEn = lista => {
    let r = lista.filter(p => norm(p.nombre) === n || norm(nombreCorto(p)) === n);
    if (r.length === 1) return r[0];
    const w = palabras(n);
    r = lista.filter(p => { const pw = palabras(p.nombre); return w.every(x => pw.indexOf(x) >= 0); });
    if (r.length === 1) return r[0];
    const exacto = r.filter(p => palabras(p.nombre).length === w.length);
    return exacto.length === 1 ? exacto[0] : null;
  };
  const enCat = catId ? buscarEn(PRODUCTOS.filter(p => p.cat === catId)) : null;
  return enCat || buscarEn(PRODUCTOS);
}
function categoriaPorNombre(s){
  const n = raiz(norm(s));
  return CATEGORIAS.find(c => raiz(norm(c.nombre)) === n) || null;
}
/* Fechas: "14 de noviembre de 2026", "sábado 14 de nov 2026", "14/11/2026", "2026-11-14" */
function leerFecha(s){
  const n = norm(s);
  let d = null, m;
  if ((m = /(\d{4})-(\d{1,2})-(\d{1,2})/.exec(n))) d = [+m[1], +m[2], +m[3]];
  else if ((m = /(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/.exec(n))) d = [+m[3] < 100 ? 2000 + +m[3] : +m[3], +m[2], +m[1]];
  else if ((m = /(\d{1,2})\s*(?:de\s+)?([a-z]{3,10})\.?(?:\s*(?:de(?:l)?\s+)?(\d{4}))?/.exec(n))) {
    const mes = MESES.findIndex(x => x === m[2] || x.slice(0, 3) === m[2].slice(0, 3) && m[2].length >= 3) + 1 || (m[2] === "setiembre" ? 9 : 0);
    if (mes) {
      let anio = m[3] ? +m[3] : new Date().getFullYear();
      if (!m[3]) { const hoy = new Date(); if (new Date(anio, mes - 1, +m[1]) < new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate())) anio++; }
      d = [anio, mes, +m[1]];
    }
  }
  if (!d) return "";
  const iso = d[0] + "-" + pad2(d[1]) + "-" + pad2(d[2]);
  return fechaDe(iso) ? iso : "";
}
/* Horas: "5:00 p. m.", "17:00", "5 pm" */
function leerHora(s){
  const n = norm(s).replace(/\./g, "").replace(/\s+/g, "");
  const m = /(\d{1,2})(?::(\d{2}))?(am|pm|hrs|h)?/.exec(n);
  if (!m) return "";
  let h = +m[1]; const mi = m[2] ? +m[2] : 0;
  if (m[3] === "pm" && h < 12) h += 12;
  if (m[3] === "am" && h === 12) h = 0;
  return h < 24 && mi < 60 ? pad2(h) + ":" + pad2(mi) : "";
}
function tipoEvento(s){
  const n = norm(s);
  if (!n || /por definir/.test(n)) return null;
  const exacto = EVENTOS.find(e => norm(e) === n);
  if (exacto) return { tipo: exacto, otro: "" };
  if (/\bxv\b|quince|15 anos/.test(n)) return { tipo: "XV años", otro: "" };
  if (/boda/.test(n)) return { tipo: "Boda", otro: "" };
  if (/infantil/.test(n)) return { tipo: "Fiesta infantil", otro: "" };
  if (/cumple/.test(n)) return { tipo: "Cumpleaños", otro: "" };
  if (/bautizo|comunion/.test(n)) return { tipo: "Bautizo / Primera comunión", otro: "" };
  if (/baby/.test(n)) return { tipo: "Baby shower", otro: "" };
  if (/reunion/.test(n)) return { tipo: "Reuniones", otro: "" };
  if (/empresa|corporativ/.test(n)) return { tipo: "Empresa", otro: "" };
  return { tipo: "Otro", otro: String(s).trim().slice(0, 40) };
}
/* Un extra de servicio dentro de la línea "Extras: …" */
function leerExtra(parte){
  const n = norm(parte);
  const montoM = /\$\s*([\d,.]+)/.exec(parte);
  const monto = montoM ? String(numOrNull(montoM[1]) || "") : "";
  if (/vaso/.test(n)) {
    const t = /\(\s*tem[aá](?:tica)?\s*:\s*([^)]*)\)/i.exec(parte);
    const cant = /(\d+)\s*(?:pzas|piezas|vasos)/i.exec(parte);
    return { id: "vasos", tema: t ? t[1].trim() : "", monto, cantidad: cant ? cant[1] : "" };
  }
  if (/tiempo|hora/.test(n)) {
    const h = /(\d+)\s*(?:h\b|hr|hora)/i.exec(parte);
    return { id: "tiempo", cant: h ? +h[1] : 1, monto };
  }
  return null;
}

function leerCotizacion(texto){
  const r = { folio: "", datos: {}, snacks: [], extras: {}, llenados: [], claves: [], noReconocidos: [] };
  let t = String(texto || "")
    .replace(/\[\s*prueba\s*\]/gi, "")
    .replace(/[*_~`]/g, "")
    .replace(/\p{Extended_Pictographic}|[\u{1F1E6}-\u{1F1FF}\u{FE0F}\u{200D}\u{20E3}]/gu, "");
  const fm = /\bOBE-\d{6}-\d{3}\b/i.exec(t) || /cotizaci[oó]n\s*:?\s*#?\s*([A-Z0-9][A-Z0-9-]{3,})/i.exec(t);
  if (fm) r.folio = (fm[1] || fm[0]).toUpperCase();
  const agregarSnack = (nombre, catId) => {
    const limpio = String(nombre).replace(/^[\s\-•·]+|[\s.]+$/g, "");
    if (!limpio || /^(los elijo|por definir)/i.test(norm(limpio))) return;
    let p = buscarProducto(limpio, catId);
    if (!p && / y /i.test(limpio)) { limpio.split(/\s+y\s+/i).forEach(x => agregarSnack(x, catId)); return; }
    if (p) { if (r.snacks.indexOf(p.id) < 0) r.snacks.push(p.id); }
    else if (r.noReconocidos.indexOf(limpio) < 0) r.noReconocidos.push(limpio);
  };
  let enSnacks = false;
  t.split(/\r?\n/).forEach(linea => {
    const ln = linea.trim();
    if (!ln) return;
    if (/^[-–—=_.·\s]{4,}$/.test(ln)) { enSnacks = false; return; }
    const n = norm(ln);
    if (/^mis\s+(\d+\s+)?snacks?\b/.test(n)) { enSnacks = true; return; }
    const m = /^([^:]{1,40}):\s*(.*)$/.exec(ln);
    if (!m) {
      if (enSnacks && !/^(hola|cotizacion|me confirman)/.test(n)) ln.split(/[,;]/).forEach(x => agregarSnack(x, null));
      return;
    }
    const clave = norm(m[1]).replace(/[^a-z ]/g, "").trim(), valor = m[2].trim();
    if (!valor) return;
    if (/^(nombre|cliente|nombre completo)$/.test(clave)) { r.datos.nombre = valor.slice(0, LIM.nombre); }
    else if (/^(telefono|tel|celular|whatsapp|cel)$/.test(clave)) { if (digitos(valor).length >= 10) r.datos.telefono = telCorto(valor); }
    else if (clave === "evento") {
      const partes = valor.split(/\s*[·|]\s*|\s+-\s+/);
      const f = leerFecha(valor);
      if (f) r.datos.fecha = f;
      const te = tipoEvento(partes[0] && !leerFecha(partes[0]) ? partes[0] : "");
      if (te) { r.datos.tipo = te.tipo; r.datos.tipoOtro = te.otro; }
    }
    else if (/^(tipo|tipo de evento)$/.test(clave)) { const te = tipoEvento(valor); if (te) { r.datos.tipo = te.tipo; r.datos.tipoOtro = te.otro; } }
    else if (/^(fecha|fecha del evento|dia)$/.test(clave)) { const f = leerFecha(valor); if (f) r.datos.fecha = f; }
    else if (/^(hora|hora del evento|hora de inicio|horario)$/.test(clave)) { const h = leerHora(valor); if (h) r.datos.hora = h; }
    else if (/^(lugar|direccion|lugar del evento|domicilio|salon)$/.test(clave)) { if (!/por definir/.test(norm(valor))) r.datos.direccion = valor.slice(0, LIM.direccion); }
    else if (/^(invitados|personas|numero de invitados|numero de personas)$/.test(clave)) { const i = /(\d{1,4})/.exec(valor); if (i) r.datos.invitados = Math.max(REGLAS.minInvitados, +i[1]); }
    else if (/^(notas?|observaciones?)$/.test(clave)) { r.datos.notas = valor.slice(0, LIM.notas); }
    else if (/^(total|anticipo)/.test(clave)) { /* se recalcula, no se lee */ }
    else if (clave === "extras" && (/[—$]|--| - |vaso|tiempo adicional|hora/i.test(valor))) {
      valor.split(/;/).forEach(parte => {
        const ex = leerExtra(parte);
        if (ex) r.extras[ex.id] = ex;
        else parte.split(",").forEach(x => agregarSnack(x, "extras"));
      });
    }
    else {
      const cat = categoriaPorNombre(clave);
      if (cat || enSnacks) valor.split(",").forEach(x => agregarSnack(x, cat ? cat.id : null));
    }
  });
  r.snacks = r.snacks.slice(0, REGLAS.productosPorBarra);
  /* Lista de lo que se llenó (para el resumen) y claves para el puntito turquesa */
  const marca = (txt, clave) => { r.llenados.push(txt); r.claves.push(clave); };
  if (r.datos.nombre) marca("nombre", "cliente.nombre");
  if (r.datos.telefono) marca("teléfono", "cliente.telefono");
  if (r.datos.tipo) marca("tipo de evento", "evento.tipo");
  if (r.datos.fecha) marca("fecha", "evento.fecha");
  if (r.datos.hora) marca("hora", "evento.hora");
  if (r.datos.direccion) marca("lugar", "evento.direccion");
  if (r.datos.invitados) marca("invitados", "evento.invitados");
  if (r.datos.notas) marca("notas", "evento.notas");
  if (r.snacks.length) marca("snacks", "snacks");
  if (r.extras.tiempo) marca("tiempo adicional", "extras.tiempo");
  return r;
}
/* Pasa lo leído a un contrato */
function aplicarLectura(k, r){
  const d = r.datos;
  if (d.nombre) k.cliente.nombre = d.nombre;
  if (d.telefono) k.cliente.telefono = d.telefono;
  if (d.tipo) { k.evento.tipo = d.tipo; k.evento.tipoOtro = d.tipoOtro || ""; }
  if (d.fecha) k.evento.fecha = d.fecha;
  if (d.hora) k.evento.hora = d.hora;
  if (d.direccion) k.evento.direccion = d.direccion;
  if (d.invitados) k.evento.invitados = clampInt(d.invitados, REGLAS.minInvitados, TOPE_INVITADOS, REGLAS.minInvitados);
  if (d.notas) k.evento.notas = d.notas;
  k.snacks = r.snacks.slice();
  if (r.extras.tiempo) { const x = extraPorId("tiempo"); k.extras.tiempo.cant = clampInt(r.extras.tiempo.cant, 1, x.max || 1, 1); k.extras.tiempo.monto = r.extras.tiempo.monto || ""; }
  k.folioCotizacion = r.folio || "";
  k.deCotizacion = r.claves.slice();
}
/* "Revise y complete: dirección, hora de inicio y teléfono" */
function porRevisar(k){
  const c = calcular(k), l = [];
  if (!k.cliente.nombre.trim()) l.push("nombre");
  if (!digitos(k.cliente.telefono)) l.push("teléfono");
  if (!k.evento.fecha) l.push("fecha");
  l.unshift("dirección");
  if (!k.evento.hora) l.splice(1, 0, "hora de inicio (opcional)");
  if (!c.invitados) l.push("invitados");
  if (c.especial) l.push("precio especial");
  c.extrasSinMonto.forEach(e => l.push(e.porHora ? "monto del tiempo adicional" : "monto de los vasos"));
  return l;
}

/* ############################################################################
   RENDER — 1) maquetación del contrato (un solo motor para vista previa y PDF)
   Todo en milímetros sobre hoja A4. Tamaños, colores y espacios tomados de
   referencia-contrato-final-limpio.pdf; las marcas de revisión, de
   referencia-contrato-con-marcas.pdf. La vista previa (SVG) y el PDF (jsPDF)
   dibujan exactamente la misma lista de operaciones: se ven igual y se paginan igual.
   ############################################################################ */
const HOJA = { W: 210, H: 297, M: 13.76, arriba: 12.2, limite: 278.6, pieLinea: 281.4, pieTexto: 286.8 };
const ANCHO = HOJA.W - 2 * HOJA.M;      // 182.5 mm
const PT = 25.4 / 72;                   // 1 punto en mm
const LH = pt => pt * PT * 1.45;        // interlineado ≈ 1.45 × tamaño de letra
const COL = {
  titulo: "#9333EA", subtitulo: "#06B6D4", seccion: "#0E7490", lineaEnc: "#E2E8F0",
  introFondo: "#FDF4FF", introBorde: "#C084FC", introTexto: "#334155", introFuerte: "#7E22CE",
  cajaFondo: "#F8FAFC", cajaBorde: "#E2E8F0", punteado: "#CBD5E1",
  etiqueta: "#64748B", valor: "#0F172A", texto: "#334155",
  t1Fondo: "#F0FDF4", t1Borde: "#86EFAC", t1Titulo: "#15803D",
  t2Fondo: "#FAF5FF", t2Borde: "#D8B4FE", t2Titulo: "#7E22CE",
  t3Fondo: "#FDF4FF", t3Borde: "#F0ABFC", t3Titulo: "#A21CAF",
  oblNegocio: "#38BDF8", oblNegocioT: "#0369A1", oblCliente: "#FB7185", oblClienteT: "#E11D48", oblBorde: "#E2E8F0",
  imgFondo: "#FFFBEB", imgBorde: "#FDE68A", imgTitulo: "#92400E", imgTexto: "#78350F", imgCasilla: "#B45309",
  firmaLinea: "#334155", divisor: "#E2E8F0", pieLinea: "#E2E8F0", pie: "#64748B",
  /* marcas de la revisión (no salen en el PDF normal) */
  nuevo: "#7C3AED", nuevoFondo: "#EDE9FE", nuevoBorde: "#C4B5FD", nuevoTexto: "#4C1D95",
  hueco: "#FEF08A", huecoTinta: "#713F12",
  marca: "#9333EA"
};
/* Espacio entre letras (mm), como en la referencia */
const CS = { titulo: 0.07, lema: 0.19, seccion: 0.155, etiqueta: 0.167, tarjeta: 0.14, categoria: 0.16, pildora: 0.21 };
/* Textos que solo aparecen en la revisión */
const REVISION = {
  pildora: "NUEVO",
  danos: "¿Lo incluimos?",
  luz: "¿con contacto de luz?",
  firmaVacia: "Nombre de quien firma",
  cancelA: "el anticipo no es reembolsable",
  cancelB: "se reembolsa el ___% si se avisa con ___ días"
};
/* Cómo se ve un dato que falta: en la revisión, resaltado en amarillo */
const HUECOS = {
  consecuenciaSaldo: { txt: "______ (¿qué pasa?)" },
  minMontaje: { txt: "___", pega: " minutos" },
  medidas: { txt: "___ × ___ m" },
  diasCambio: { txt: "___", pega: " días" },
  diasCancel: { txt: "___", pega: " días" },
  pctReembolso: { txt: "___", pega: "%" },
  precioHora: { txt: "$___", pega: " por hora" },
  responsable: { txt: REVISION.firmaVacia }
};
const FIRMA_A_MANO = "Nombre: ____________________";

/* Tipografía del contrato: Noto Sans (la de su contrato original), subconjunto Latin-1 incrustado
   en FUENTES (último <script>). Se registra igual en el medidor y en cada PDF, y la vista previa usa
   el mismo archivo con @font-face: lo que se mide, lo que se ve y lo que se imprime coinciden.
   Si FUENTES faltara, todo cae a Helvetica de jsPDF. */
const FUENTE = { familia: "NotoSans", normal: "NotoSans-Regular.ttf", bold: "NotoSans-Bold.ttf", italic: "NotoSans-Italic.ttf" };
let _conNoto = false;
function registrarFuentes(doc){
  if (typeof FUENTES === "undefined" || !FUENTES.regular) return false;
  try {
    doc.addFileToVFS(FUENTE.normal, FUENTES.regular); doc.addFont(FUENTE.normal, FUENTE.familia, "normal");
    doc.addFileToVFS(FUENTE.bold, FUENTES.bold); doc.addFont(FUENTE.bold, FUENTE.familia, "bold");
    doc.addFileToVFS(FUENTE.italic, FUENTES.italic); doc.addFont(FUENTE.italic, FUENTE.familia, "italic");
    return true;
  } catch (e) { return false; }
}
const familiaPDF = () => _conNoto ? FUENTE.familia : "helvetica";
const estilo = (b, i) => _conNoto ? (b ? "bold" : i ? "italic" : "normal") : (b && i ? "bolditalic" : b ? "bold" : i ? "italic" : "normal");
/* Medición de texto con las mismas métricas del PDF */
let _medidor = null;
function anchoTxt(s, pt, b, i){
  if (!_medidor) { _medidor = new window.jspdf.jsPDF({ unit: "mm", format: "a4" }); _conNoto = registrarFuentes(_medidor); }
  _medidor.setFont(familiaPDF(), estilo(b, i));
  _medidor.setFontSize(pt);
  return _medidor.getTextWidth(String(s).replace(/ /g, " "));   // el espacio que no se parte se dibuja igual que un espacio
}
/* La vista previa usa la misma Noto Sans (mismo Base64) */
function fuentesVistaPrevia(){
  if (typeof FUENTES === "undefined" || !FUENTES.regular) return;
  const ff = (b64, peso, est) => '@font-face{font-family:"NotoSansContrato";src:url(data:font/ttf;base64,' + b64 + ') format("truetype");font-weight:' + peso + ";font-style:" + est + ";font-display:block}";
  const st = document.createElement("style");
  st.textContent = ff(FUENTES.regular, 400, "normal") + ff(FUENTES.bold, 700, "normal") + ff(FUENTES.italic, 400, "italic");
  document.head.appendChild(st);
}
/* Caracteres que trae la fuente: Latin-1 + comillas, rayas, viñeta y puntos suspensivos; lo demás (emojis) se quita */
const pdfTxt = s => String(s == null ? "" : s).replace(/\t/g, " ").replace(/[^\n\x20-\x7E\xA0-\xFF•–—‘’“”…]/g, "");
/* "**negritas** y texto" → runs */
function runs(t, base){
  base = base || {};
  return String(t).split("**").map((s, i) => Object.assign({}, base, { s: s, b: i % 2 === 1 ? true : !!base.b })).filter(r => r.s);
}
/* Parte runs con estilos mezclados en líneas que caben en maxW */
function envolver(rs, maxW, pt){
  const lineas = [];
  let segs = [], x = 0, esp = null;
  const cerrar = () => { lineas.push({ segs: segs, w: x }); segs = []; x = 0; esp = null; };
  const poner = (s, r, w) => {
    const u = segs[segs.length - 1];
    if (u && u.b === !!r.b && u.i === !!r.i && u.c === r.c) u.s += s;
    else segs.push({ s: s, x: x, b: !!r.b, i: !!r.i, c: r.c });
    x += w;
  };
  rs.forEach(r => {
    pdfTxt(r.s).split(/(\n|[ ]+)/).forEach(tok => {
      if (!tok) return;
      if (tok === "\n") { cerrar(); return; }
      if (/^ +$/.test(tok)) { if (segs.length) esp = { r: r, w: anchoTxt(" ", pt, r.b, r.i) }; return; }
      let w = anchoTxt(tok, pt, r.b, r.i);
      if (segs.length && x + (esp ? esp.w : 0) + w > maxW) cerrar();
      else if (esp) poner(" ", esp.r, esp.w);
      esp = null;
      while (w > maxW && tok.length > 1) {          // palabra más larga que la línea: se corta
        let n = tok.length - 1;
        while (n > 1 && anchoTxt(tok.slice(0, n), pt, r.b, r.i) > maxW - x) n--;
        poner(tok.slice(0, n), r, anchoTxt(tok.slice(0, n), pt, r.b, r.i));
        cerrar();
        tok = tok.slice(n); w = anchoTxt(tok, pt, r.b, r.i);
      }
      poner(tok, r, w);
    });
  });
  if (segs.length || !lineas.length) cerrar();
  return lineas;
}

/* Operaciones de dibujo (en mm) */
const R = (pg, x, y, w, h, o) => pg.ops.push(Object.assign({ t: "rect", x, y, w, h }, o));
const L = (pg, x1, y1, x2, y2, o) => pg.ops.push(Object.assign({ t: "line", x1, y1, x2, y2 }, o));
const P = (pg, x, y, r, f) => pg.ops.push({ t: "circ", x, y, r, f });
/* Texto. Con espacio entre letras (cs) se alinea aquí mismo, para que SVG y PDF coincidan */
function T(pg, s, x, y, pt, o){
  o = Object.assign({ b: false, i: false, al: "left", cs: 0 }, o);
  s = pdfTxt(s);
  if (o.cs && o.al !== "left") { const w = anchoTxt(s, pt, o.b, o.i) + o.cs * s.length; x = o.al === "right" ? x - w : x - w / 2; o.al = "left"; }
  pg.ops.push({ t: "text", s: s, x: x, y: y, pt: pt, b: o.b, i: o.i, c: o.c, al: o.al, cs: o.cs });
}
const anchoCs = (s, pt, b, cs) => { s = pdfTxt(s); return anchoTxt(s, pt, b, false) + (cs || 0) * s.length; };
const centro = (yb, pt) => yb - pt * PT * 0.36;            // centro de las minúsculas de una línea
const lineaBase = (yc, pt) => yc + pt * PT * 0.36;

/* ---- Marcas de la revisión ---- */
const PILDORA = { pt: 7, h: 3.9, pad: 1.85 };
const anchoPildora = () => anchoCs(REVISION.pildora, PILDORA.pt, true, CS.pildora) + 2 * PILDORA.pad;
/* Píldora morada "NUEVO" centrada en yc; devuelve su ancho */
function pildora(pg, x, yc){
  const w = anchoPildora();
  R(pg, x, yc - PILDORA.h / 2, w, PILDORA.h, { f: COL.nuevoFondo, s: COL.nuevoBorde, lw: 0.26, r: PILDORA.h / 2 });
  T(pg, REVISION.pildora, x + PILDORA.pad, lineaBase(yc, PILDORA.pt) + 0.05, PILDORA.pt, { b: true, c: COL.nuevo, cs: CS.pildora });
  return w;
}
/* Barra morada de 0.8 mm, 3.7 mm a la izquierda de lo nuevo */
const barra = (pg, x, y1, y2) => R(pg, x - 3.7, y1, 0.8, Math.max(1, y2 - y1), { f: COL.nuevo, r: 0.4 });
/* Dato que falta: texto que no se parte, resaltado en amarillo (lineasTxt dibuja el fondo) */
const hueco = txt => ({ s: " " + String(txt).replace(/ /g, " ") + " ", b: true, c: COL.huecoTinta });
/* Lugar reservado para una píldora dentro de un párrafo */
const MARCA_PILDORA = "pildora";
const runPildora = pt => ({ s: " ".repeat(Math.ceil((anchoPildora() + 0.3) / anchoTxt(" ", pt, false, false))), c: MARCA_PILDORA });
function lineasTxt(pg, lineas, x, y, pt, lh, color, al, maxW){
  lineas.forEach((ln, n) => {
    const off = al === "center" ? (maxW - ln.w) / 2 : al === "right" ? maxW - ln.w : 0, yb = y + n * lh;
    ln.segs.forEach(sg => {
      const xs = x + off + sg.x;
      if (sg.c === MARCA_PILDORA) { pildora(pg, xs, centro(yb, pt)); return; }
      if (sg.c === COL.huecoTinta) R(pg, xs, yb - pt * PT * 0.8, anchoTxt(sg.s, pt, sg.b, sg.i), pt * PT * 1.08, { f: COL.hueco, r: 0.8 });
      T(pg, sg.s, xs, yb, pt, { b: sg.b, i: sg.i, c: sg.c || color });
    });
  });
}
/* Plantilla de cláusula → runs: **negritas**, {{datos}} y, en la revisión, huecos amarillos */
function runsTexto(t, v, o, base){
  base = base || {};
  const out = [], partes = String(t).split(/(\{\{\w+\}\}|\*\*)/);
  let negrita = false;
  for (let i = 0; i < partes.length; i++) {
    const p = partes[i];
    if (!p) continue;
    if (p === "**") { negrita = !negrita; continue; }
    const m = /^\{\{(\w+)\}\}$/.exec(p);
    if (!m) { out.push(Object.assign({}, base, { s: p, b: negrita || !!base.b })); continue; }
    const nom = m[1], val = v[nom];
    if (nom === "luz") {                                   // casilla: con luz, sin luz o (revisión) por decidir
      if (val) out.push(Object.assign({}, base, { s: val, b: negrita }));
      else if (o.rev && v.luzPendiente) { out.push(Object.assign({}, base, { s: " " })); out.push(hueco(REVISION.luz)); }
      continue;
    }
    if (val != null && String(val).trim() !== "") { out.push(Object.assign({}, base, { s: String(val).trim(), b: negrita || !!base.b })); continue; }
    if (!o.rev) { out.push(Object.assign({}, base, { s: "____", b: negrita })); continue; }
    const h = HUECOS[nom] || { txt: "____" };
    let txt = h.txt;
    if (h.pega && partes[i + 1] && partes[i + 1].indexOf(h.pega) === 0) { txt += h.pega; partes[i + 1] = partes[i + 1].slice(h.pega.length); }
    out.push(hueco(txt));
  }
  return out;
}
/* "viernes 13 de noviembre" (sin año) */
function fechaSinAnio(d){ return d.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" }).replace(/^([^\s,]+),\s*/, "$1 "); }
const mayuscula = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : "";

/* ---- Bloques del contrato. Cada uno: { gap, alto, pintar(pg, y), junto } ----
   trazo(pg, y) dibuja y devuelve dónde termina; el alto se mide con una hoja de ensayo,
   así lo medido y lo dibujado nunca se separan. */
const GAP_SECCION = 4.6;      // de lo anterior al título de sección (si no cabe en 2 hojas se recorta esto, no la letra)
const ALTO_CABEZA = 6.9;      // del borde del bloque al contenido (título de 11 pt incluido)
const ENTRE_PARRAFOS = 1.0;   // mm extra entre párrafos sueltos
function bloque(gap, trazo, junto){ return { gap: gap, junto: !!junto, alto: trazo({ ops: [] }, 0), pintar: trazo }; }
function cabeza(pg, y, num, titulo, o, nuevo){
  const yb = y + 3.9, txt = (num ? num + ". " : "") + titulo.toUpperCase();
  T(pg, txt, HOJA.M, yb, 11, { b: true, c: COL.seccion, cs: CS.seccion });
  if (o.rev && nuevo) pildora(pg, HOJA.M + anchoCs(txt, 11, true, CS.seccion) + 2.2, centro(yb, 11));
  return y + ALTO_CABEZA;
}

function bloqueEncabezado(k, c, o, v){
  const on = activa(k, "folio"), cl = clausulaPorId("folio");
  return bloque(0, (pg, y) => {
    const dy = y - HOJA.arriba, der = HOJA.M + ANCHO;
    pg.ops.push({ t: "img", x: HOJA.M, y: 13.0 + dy, w: 28.5, h: 19 });
    T(pg, TEXTOS.titulo, der, 20.11 + dy, 21, { b: true, c: COL.titulo, al: "right", cs: CS.titulo });
    T(pg, CONFIG.lema.toUpperCase(), der, 26.46 + dy, 9, { b: true, c: COL.subtitulo, al: "right", cs: CS.lema });
    if (on || o.rev) {
      const txt = llenar(cl.texto + (k.folioCotizacion ? cl.textoCotizacion : ""), v).replace(/\*\*/g, "");
      T(pg, txt, der, 32.28 + dy, 8.5, { c: COL.etiqueta, al: "right" });
      if (o.rev) pildora(pg, der - anchoTxt(pdfTxt(txt), 8.5) - 1.6 - anchoPildora(), centro(32.28 + dy, 8.5));
    }
    L(pg, HOJA.M, 36.6 + dy, der, 36.6 + dy, { s: COL.lineaEnc, lw: 0.26 });
    return 36.7 + dy;
  });
}
function bloqueIntro(k, c, o){
  const BORDE = 0.79, PAD = 3.44, X = HOJA.M + BORDE + PAD, maxW = ANCHO - BORDE - 2 * PAD, lh = LH(9.7);
  const ln = envolver([{ s: TEXTOS.intro[0], b: true, c: COL.introFuerte }, { s: TEXTOS.intro[1] }], maxW, 9.7);
  const alto = 6.33 + (ln.length - 1) * lh + 3.76;
  return bloque(3.8, (pg, y) => {
    R(pg, HOJA.M, y, ANCHO, alto, { f: COL.introFondo, r: 2.1 });
    R(pg, HOJA.M, y, 3, alto, { f: COL.introFondo });          // esquinas izquierdas rectas, como la referencia
    R(pg, HOJA.M, y, BORDE, alto, { f: COL.introBorde });
    lineasTxt(pg, ln, X, y + 6.33, 9.7, lh, COL.introTexto, "left", maxW);
    return y + alto;
  });
}
function bloqueDatos(k, c, o, num){
  const E = TEXTOS.etiquetas, lh = LH(10), X = [HOJA.M + 3.7, HOJA.M + 94.45], AN = 84.1, ANCHA = ANCHO - 7.4;
  const g = k.cliente.festejadoGenero;
  const fest = c.festejado ? (g === "a" ? "Festejada" : g === "o" ? "Festejado" : "Festejado(a)") + ": " + c.festejado : "";
  const tipo = [c.tipo, fest].filter(Boolean).join(" · ");
  const campo = (et, val, nuevo, ancha) => ({ et, val: val || "", nuevo: !!nuevo, ancha: !!ancha });
  const filas = [
    [campo(E.nombre, c.cliente), campo(E.telefono, c.telefonoTxt)],
    [campo(E.fecha, mayuscula(c.fechaTxt)), campo(E.hora, c.horarioTxt || "Por acordar")],
    [campo(E.personas, c.invitados ? String(c.invitados) : ""), campo(E.lugar, c.direccion)]
  ];
  if (tipo || c.contacto) filas.push([tipo ? campo(c.tipo ? E.tipo : "FESTEJADO(A)", tipo, true) : null, c.contacto ? campo(E.contacto, c.contacto, true) : null]);
  if (c.notas) filas.push([campo(E.notas, c.notas, true, true)]);
  filas.forEach(f => f.forEach((cp, j) => { if (cp) { cp.x = X[j]; cp.w = cp.ancha ? ANCHA : AN; cp.ln = envolver([{ s: cp.val, b: true }], cp.w, 10); } }));
  return bloque(GAP_SECCION, (pg, y) => {
    const y0 = cabeza(pg, y, num, TEXTOS.secDatos, o, false);
    const caja = { ops: [] };                                  // la caja se dibuja primero, ya con su alto
    let yl = y0 + 7.37, yd = yl;
    filas.forEach(f => {
      const extra = Math.max.apply(null, f.map(cp => cp ? cp.ln.length - 1 : 0)) * lh;
      yd = yl + 5.3 + extra + 2.73;
      f.forEach(cp => {
        if (!cp) return;
        T(caja, cp.et, cp.x, yl, 7.9, { b: true, c: COL.etiqueta, cs: CS.etiqueta });
        if (o.rev && cp.nuevo) { pildora(caja, cp.x + anchoCs(cp.et, 7.9, true, CS.etiqueta) + 1.4, centro(yl, 7.9)); barra(caja, cp.x, yl - 3.2, yd - 0.7); }
        lineasTxt(caja, cp.ln, cp.x, yl + 5.3, 10, lh, COL.valor, "left", 0);
        L(caja, cp.x, yd, cp.x + cp.w, yd, { s: COL.punteado, lw: 0.26, dash: [0.35, 0.45] });
      });
      yl = yd + 4.67;
    });
    const fin = yd + 2.95;
    R(pg, HOJA.M, y0, ANCHO, fin - y0, { f: COL.cajaFondo, s: COL.cajaBorde, lw: 0.26, r: 2.1 });
    pg.ops.push.apply(pg.ops, caja.ops);
    return fin;
  });
}
function bloqueServicio(k, c, o, num, v){
  const cl = clausulaPorId("servicio"), X = HOJA.M + 3.7, IW = ANCHO - 7.4, lh = LH(9.7);
  const par = envolver(runsTexto(cl.texto, v, o), IW, 9.7);
  const n = c.grupos.length, GAPC = 1.8, CWc = n ? (IW - (n - 1) * GAPC) / n : 0, LHI = 8.8 * PT * 1.35;
  const cols = c.grupos.map(gr => ({ gr, items: gr.items.map(p => envolver([{ s: nombreCorto(p) }], CWc - 3.7, 8.8)) }));
  const lineasMax = n ? Math.max.apply(null, cols.map(col => col.items.reduce((s, l) => s + l.length, 0))) : 0;
  const tit = "Snacks elegidos (" + (c.nSnacks === REGLAS.productosPorBarra ? c.nSnacks : c.nSnacks + " de " + REGLAS.productosPorBarra) + "):";
  const lnTit = envolver([{ s: tit, b: true }].concat(n ? [] : [{ s: " Por elegir con EL CLIENTE." }]), IW, 9.7);
  /* extras en un solo párrafo */
  const tpl = cl.extras;
  const partesEx = c.extras.map(e => {
    const monto = e.importe == null ? "$ ____" : money(e.importe);
    if (e.porHora) return llenar(tpl.tiempo, { h: String(e.cant), monto: monto });
    let t = tpl.vasos;
    if (e.cantidad == null) t = t.replace(/,\s*\{\{cantidad\}\}\s*piezas/, "");
    if (!e.tema) t = t.replace(/,\s*tem[aá]tica\s*"\{\{tema\}\}"/, "");
    return llenar(t, { tema: e.tema, cantidad: e.cantidad == null ? "" : String(e.cantidad), monto: monto });
  });
  const lnEx = partesEx.length ? envolver([{ s: "Extras:", b: true }, { s: " " + partesEx.join("; ") + "." }], IW, 9.7) : [];
  const lnVasos = cl.vasos ? envolver([{ s: cl.vasos }], IW, 9.7) : [];
  return bloque(GAP_SECCION, (pg, y) => {
    const y0 = cabeza(pg, y, num, TEXTOS.secServicio, o, true);
    const caja = { ops: [] };
    let yy = y0 + 6.94;
    lineasTxt(caja, par, X, yy, 9.7, lh, COL.texto, "left", IW);
    yy += (par.length - 1) * lh + 6.61;
    lineasTxt(caja, lnTit, X, yy, 9.7, lh, COL.texto, "left", IW);
    yy += (lnTit.length - 1) * lh;
    let ancla = yy + 1.6;
    if (n) {
      const top = yy + 3.0, altoCat = 4.69 + 5.02 + (lineasMax - 1) * LHI + 2.5;
      cols.forEach((col, i) => {

function bloqueHonorarios(k, c, o, num, v){

function bloqueObligaciones(k, c, o, num, v){

/* Texto de cada cláusula de las secciones nuevas, ya con sus datos (o huecos en la revisión) */
function runsParte(id, k, c, v, o){
  const cl = clausulaPorId(id);
  if (id === "duracion") {
    const r = runsTexto(cl.texto, Object.assign({}, v, { horas: String(c.horas) }), o);
    if (v.precioHora || o.rev) r.push.apply(r, runsTexto(cl.textoPrecio, v, o));    // sin precio, la frase no se imprime
    return r;
  }
  if (id === "cancelacion") {
    const va = cl.variantes[k.datos.varianteCancel];
    if (va) return runsTexto(va.texto, v, o);
    if (!o.rev) return runsTexto(cl.variantes.A.texto, v, o);
    return [{ s: "En caso de cancelación, " }, hueco(REVISION.cancelA), { s: " " }, { s: "o", c: COL.etiqueta }, { s: " " }, hueco(REVISION.cancelB), { s: "." }];
  }
  return runsTexto(textoDe(cl, k), v, o);
}

/* Arma el contrato completo: bloques → páginas (ninguna sección se parte; las
   firmas viajan con el último párrafo; nunca queda una hoja vacía).
   o.rev = revisión: todas las cláusulas visibles, con píldoras, barras y huecos. */
function maquetar(k, c, o){
  o = o || {};
  const tiempo = extraPorId("tiempo");
  const v = Object.assign(variables(k, c), {
    precioHora: tiempo && typeof tiempo.precio === "number" && isFinite(tiempo.precio) ? money(tiempo.precio) : "",
    luzPendiente: !String(k.datos.medidas || "").trim()
  });
  const ver = id => activa(k, id) || !!o.rev;
  let n = 0;
  const bloques = [bloqueEncabezado(k, c, o, v), bloqueIntro(k, c, o), bloqueDatos(k, c, o, ++n)];
  if (ver("servicio")) bloques.push(bloqueServicio(k, c, o, ++n, v));
  bloques.push(bloqueHonorarios(k, c, o, ++n, v));
  bloques.push(bloqueObligaciones(k, c, o, ++n, v));
  [[TEXTOS.secDuracion, ["duracion", "retraso"]], [TEXTOS.secCambios, ["cambios", "cancelacion"]]].forEach(s => {
    const partes = s[1].filter(ver).map(id => ({ id: id, runs: runsParte(id, k, c, v, o) }));
    if (partes.length) bloques.push(bloqueTexto(k, c, o, ++n, s[0], partes));
  });
  bloques.push(bloqueImagenes(k, c, o));
  bloques.push(bloqueFirmas(k, c, o, v));

  const paginas = [];
  let pg = { ops: [] }, y = HOJA.arriba, vacia = true;
  bloques.forEach((b, i) => {
    let necesita = (vacia ? 0 : b.gap) + b.alto;
    if (b.junto && bloques[i + 1]) necesita += bloques[i + 1].gap + bloques[i + 1].alto;   // firmas nunca solas
    if (!vacia && y + necesita > HOJA.limite) { paginas.push(pg); pg = { ops: [] }; y = HOJA.arriba; vacia = true; }
    if (!vacia) y += b.gap;
    b.pintar(pg, y);
    y += b.alto;
    vacia = false;
  });
  paginas.push(pg);
  /* pie y marca de agua en cada hoja */
  paginas.forEach((p, i) => {
    L(p, HOJA.M, HOJA.pieLinea, HOJA.M + ANCHO, HOJA.pieLinea, { s: COL.pieLinea, lw: 0.26 });
    T(p, TEXTOS.pie + " · Folio " + k.folio, HOJA.M, HOJA.pieTexto, 8.4, { c: COL.pie });
    T(p, llenar(TEXTOS.pagina, { n: String(i + 1), total: String(paginas.length) }), HOJA.M + ANCHO, HOJA.pieTexto, 8.4, { c: COL.pie, al: "right" });
    if (o.marca) {
      const pt = 74, ang = 28, cs = 2, s = "BORRADOR", w = anchoTxt(s, pt, true) + cs * s.length, capH = 0.72 * pt * PT, a = ang * Math.PI / 180;
      const x = HOJA.W / 2 - (w / 2) * Math.cos(a) + (capH / 2) * Math.sin(a), yy = HOJA.H / 2 + (w / 2) * Math.sin(a) + (capH / 2) * Math.cos(a);
      p.ops.push({ t: "marca", s: s, x: x, y: yy, pt: pt, ang: ang, cs: cs, c: COL.marca, op: 0.06 });
    }
  });
  return paginas;
}

/* RENDER — 2) una página como SVG (vista previa) */
const fmt = n => String(Math.round(n * 100) / 100);
function svgPagina(pg){
  const out = ['<svg viewBox="0 0 210 297" role="img" aria-label="Hoja del contrato" preserveAspectRatio="xMidYMid meet">'];
  pg.ops.forEach(op => {
    switch (op.t) {
      case "rect":
        out.push('<rect x="' + fmt(op.x) + '" y="' + fmt(op.y) + '" width="' + fmt(op.w) + '" height="' + fmt(op.h) + '"' + (op.r ? ' rx="' + fmt(op.r) + '"' : "") +
          ' fill="' + (op.f || "none") + '"' + (op.s ? ' stroke="' + op.s + '" stroke-width="' + (op.lw || 0.25) + '"' : "") + "/>");
        break;
      case "line":
        out.push('<line x1="' + fmt(op.x1) + '" y1="' + fmt(op.y1) + '" x2="' + fmt(op.x2) + '" y2="' + fmt(op.y2) + '" stroke="' + op.s + '" stroke-width="' + (op.lw || 0.25) + '"' + (op.dash ? ' stroke-dasharray="' + op.dash.join(" ") + '"' : "") + "/>");
        break;
      case "circ":
        out.push('<circle cx="' + fmt(op.x) + '" cy="' + fmt(op.y) + '" r="' + op.r + '" fill="' + op.f + '"/>');
        break;
      case "text":
        out.push('<text x="' + fmt(op.x) + '" y="' + fmt(op.y) + '" font-size="' + fmt(op.pt * PT) + '"' + (op.b ? ' font-weight="700"' : "") + (op.i ? ' font-style="italic"' : "") +
          (op.cs ? ' letter-spacing="' + fmt(op.cs) + '"' : "") +
          ' fill="' + op.c + '"' + (op.al === "center" ? ' text-anchor="middle"' : op.al === "right" ? ' text-anchor="end"' : "") + ">" + esc(op.s) + "</text>");
        break;
      case "img":
        if (typeof IMG !== "undefined" && IMG.logo) out.push("<image href='" + esc(IMG.logo) + "' x=\"" + op.x + '" y="' + op.y + '" width="' + op.w + '" height="' + op.h + '" preserveAspectRatio="none"/>');
        break;
      case "marca":
        out.push('<text x="' + fmt(op.x) + '" y="' + fmt(op.y) + '" font-size="' + fmt(op.pt * PT) + '" font-weight="700"' + (op.cs ? ' letter-spacing="' + fmt(op.cs) + '"' : "") +
          ' fill="' + op.c + '" fill-opacity="' + op.op + '" transform="rotate(' + (-op.ang) + " " + fmt(op.x) + " " + fmt(op.y) + ')">' + esc(op.s) + "</text>");
        break;
    }
  });
  out.push("</svg>");
  return out.join("");
}

/* RENDER — 3) pantallas de la herramienta */
const punto = clave => K && K.deCotizacion.indexOf(clave) >= 0 ? '<i class="pcot" title="Llegó de la cotización"><span class="sr">(llegó de la cotización)</span></i>' : "";

function claseErr(campo){ return intento && faltantes(K, calcular(K)).some(f => f.campo === campo) ? " err" : ""; }
function inputTxt(clave, etiq, o){

  const campo = o.area
    ? '<textarea class="inp' + claseErr(clave) + '"' + attrs + ' rows="3">' + esc(val) + "</textarea>"

    case "clausulas": {

function refrescar(){

  const c = calcular(K), falt = intento ? faltantes(K, c) : [];
  SECCIONES.forEach((s, i) => {
    const el = $("#sec-" + s.id); if (!el) return;
    const mal = falt.some(f => f.sec === s.id);
    el.classList.toggle("falta", mal);
    el.classList.toggle("ok", !mal && seccionCompleta(s.id, c));
    const sn = $("#sn-" + s.id);
    sn.innerHTML = mal ? ic("ic-alerta", "") : seccionCompleta(s.id, c) ? ic("ic-check", "") : String(i + 1);
    $("#sr-" + s.id).textContent = mal ? "Falta: " + listaY(falt.filter(f => f.sec === s.id).map(f => f.txt)) : resumenSeccion(s.id, c);
  });
  const tv = $("#totalVivo"); if (tv) tv.textContent = c.total == null ? "" : "Total " + money(c.total);
  const pv = $("#paqVivo"); if (pv) pv.innerHTML = paqVivoHTML(c);
  const pb = $("#paqBox"); if (pb) pb.outerHTML = paqBoxHTML(c);

let _obs = null;
function vigilarAcciones(){
  const fab = $("#fab"), acc = $("#acciones");
  if (_obs) { _obs.disconnect(); _obs = null; }
  if (!("IntersectionObserver" in window) || !acc) { fab.hidden = true; return; }

/* ############################################################################
   PDF — se dibuja con texto vectorial (jsPDF + Helvetica), A4 vertical
   ############################################################################ */
function pintarPDF(paginas, k){
  const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4", orientation: "portrait", compress: true });
  registrarFuentes(doc);                                    // Noto Sans, igual que en el medidor
  doc.setProperties({ title: "Contrato " + CONFIG.negocio + " " + k.folio, subject: "Contrato de servicio", author: CONFIG.negocio, creator: CONFIG.negocio });
  paginas.forEach((pg, i) => {
    if (i) doc.addPage("a4", "portrait");
    pg.ops.forEach(op => {
      switch (op.t) {
        case "rect": {
          const st = op.f && op.s ? "FD" : op.f ? "F" : "S";
          if (op.f) doc.setFillColor(op.f);
          if (op.s) { doc.setDrawColor(op.s); doc.setLineWidth(op.lw || 0.25); }
          doc.setLineDashPattern([], 0);
          if (op.r) doc.roundedRect(op.x, op.y, op.w, op.h, op.r, op.r, st); else doc.rect(op.x, op.y, op.w, op.h, st);
          break;
        }
        case "line":
          doc.setDrawColor(op.s); doc.setLineWidth(op.lw || 0.25);
          doc.setLineDashPattern(op.dash || [], 0);
          doc.line(op.x1, op.y1, op.x2, op.y2);
          doc.setLineDashPattern([], 0);
          break;
        case "circ":
          doc.setFillColor(op.f); doc.circle(op.x, op.y, op.r, "F");
          break;
        case "text":
          doc.setFont(familiaPDF(), estilo(op.b, op.i)); doc.setFontSize(op.pt); doc.setTextColor(op.c);
          { const s = op.s.replace(/ /g, " ");                             // jsPDF mide mal el espacio que no se parte; se ve igual
            if (op.cs) doc.text(s, op.x, op.y, { charSpace: op.cs });            // con espacio entre letras siempre llega alineado a la izquierda
            else if (op.al === "left") doc.text(s, op.x, op.y);
            else doc.text(s, op.x, op.y, { align: op.al }); }
          break;
        case "img":
          if (typeof IMG !== "undefined" && IMG.logo) { try { doc.addImage(IMG.logo, "PNG", op.x, op.y, op.w, op.h, "logo", "FAST"); } catch (e) {} }
          break;
        case "marca":
          doc.saveGraphicsState();
          doc.setGState(new doc.GState({ opacity: op.op }));
          doc.setFont(familiaPDF(), "bold"); doc.setFontSize(op.pt); doc.setTextColor(op.c);
          doc.text(op.s, op.x, op.y, { angle: op.ang, charSpace: op.cs || 0 });
          doc.restoreGraphicsState();
          break;
      }
    });
  });
  return doc;
}
function nombrePDF(k){
  const nom = sinAcentos(k.cliente.nombre).slice(0, 50);
  return "Contrato " + sinAcentos(CONFIG.negocio) + " - " + sinAcentos(k.folio) + (nom ? " - " + nom : "") + ".pdf";

/* Arma el PDF de un contrato (sin notas de revisión) */
function construirPDF(k, rev){
  const c = calcular(k);
  const doc = pintarPDF(maquetar(k, c, { rev: !!rev, marca: BORRADOR }), k);
  const blob = doc.output("blob");
  const nombre = rev ? "Contrato " + sinAcentos(CONFIG.negocio) + " - REVISION - " + sinAcentos(k.folio) + ".pdf" : nombrePDF(k);
  return { doc, blob, nombre, paginas: doc.getNumberOfPages() };
}

/* Revisa lo obligatorio; si falta algo, marca la sección en rosa, la abre y avisa */
function validarOAvisar(){
  const c = calcular(K), falt = faltantes(K, c);
  if (!falt.length) return true;
  intento = true;
  abierta = falt[0].sec;
  if (vista !== "contrato") irA("contrato"); else renderContrato();

function descargarArchivo(blob, nombre){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nombre; a.rel = "noopener"; a.style.display = "none";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function generar(){
  if (!(window.jspdf && window.jspdf.jsPDF)) { toast("No pudimos armar el PDF en este navegador."); return null; }
  if (!validarOAvisar()) return null;

}
const AVISO_DESCARGA = "Se descargó el PDF. Adjúntelo en el chat de WhatsApp de su cliente.";
function compartirPDF(){
  const r = generar(); if (!r) return;
  let archivo = null;
  try { archivo = new File([r.blob], r.nombre, { type: "application/pdf" }); } catch (e) {}
  if (archivo && navigator.canShare && navigator.share && navigator.canShare({ files: [archivo] })) {
    navigator.share({ files: [archivo], title: r.nombre })
      .then(() => toast("Listo. El contrato " + K.folio + " quedó en el historial."))
      .catch(err => { if (err && err.name === "AbortError") return; descargarArchivo(r.blob, r.nombre); toast(AVISO_DESCARGA); });
  } else {
    descargarArchivo(r.blob, r.nombre);
    toast(AVISO_DESCARGA);
  }
  renderVista();
}
function descargarPDF(){

/* ############################################################################
   HISTORIAL Y RESPALDO — solo en este celular (localStorage)
   ############################################################################ */
const numFolio = f => { const m = /(\d+)\s*$/.exec(String(f || "")); return m ? +m[1] : 0; };
function siguienteFolio(){
  const n = Math.max(ultimoFolio, HIST.reduce((m, h) => Math.max(m, numFolio(h.folio)), 0)) + 1;
  return CONFIG.prefijoFolio + String(n).padStart(4, "0");
}
function cargarDatos(){
  almacenOK = probarAlmacen();
  const h = leerJSON(KEY.hist, []);
  HIST = Array.isArray(h) ? h.map(normalizarContrato).filter(Boolean) : [];
  ultimoFolio = clampInt(leerJSON(KEY.folio, 0), 0, 999999, 0);
  const p = leerJSON(KEY.pred, null);
  if (p && typeof p === "object") {
    PRED.activas = {}; PRED.datos = {};
    if (p.activas) CLAUSULAS.forEach(cl => { if (cl.tipo !== "original" && typeof p.activas[cl.id] === "boolean") PRED.activas[cl.id] = p.activas[cl.id]; });
    if (p.datos) Object.keys(DATOS_CLAUSULAS).forEach(d => { if (d in p.datos) PRED.datos[d] = DATOS_CLAUSULAS[d].tipo === "casilla" ? !!p.datos[d] : String(p.datos[d] || "").slice(0, 160); });
  }
  const a = leerJSON(KEY.actual, null);
  const k = a && normalizarContrato(a.contrato);
  if (k) { K = k; sucio = !!a.sucio; } else { K = contratoNuevo(siguienteFolio()); sucio = false; }
}
function guardarHistorial(){
  HIST.sort((a, b) => String(b.actualizado).localeCompare(String(a.actualizado)));
  if (HIST.length > 50) HIST = HIST.slice(0, 50);
  guardarJSON(KEY.hist, HIST);
  guardarJSON(KEY.folio, ultimoFolio);
}
let _gT = 0;
function guardarActual(){ clearTimeout(_gT); _gT = setTimeout(() => guardarJSON(KEY.actual, { contrato: K, sucio: sucio }), 250); }
const guardarPred = () => guardarJSON(KEY.pred, PRED);
/* Al generar, compartir o mandar mensaje: el folio se consume (la primera vez) y se guarda */
function registrar(){
  if (!K.generado) {
    if (HIST.some(h => h.folio === K.folio && h.id !== K.id)) K.folio = siguienteFolio();
    ultimoFolio = Math.max(ultimoFolio, numFolio(K.folio));
    K.generado = true;
    if (!K.elaborado) K.elaborado = hoyISO();
  }
  K.actualizado = new Date().toISOString();
  const copia = JSON.parse(JSON.stringify(K));
  const i = HIST.findIndex(h => h.id === K.id);
  if (i >= 0) HIST[i] = copia; else HIST.unshift(copia);
  guardarHistorial();
  sucio = false;
  guardarActual();
}
/* Antes de reemplazar el contrato en curso, pregunta si tiene cambios sin generar */
function conCuidado(fn){
  if (sucio && tieneDatos(K)) { pendiente = fn; irA("inicio"); window.scrollTo(0, 0); return; }
  fn();
}
function empezar(k, seccion){
  K = k; sucio = tieneDatos(k); intento = false; resumenCot = null; errCl = {}; msgInv = ""; abierta = seccion || "cliente";

}
function nuevo(){ empezar(contratoNuevo(siguienteFolio())); }
function abrirHist(id){ const k = HIST.find(h => h.id === id); if (!k) return; empezar(normalizarContrato(k)); sucio = false; guardarActual(); renderContrato(); }
function duplicar(id){
  const o = HIST.find(h => h.id === id); if (!o) return;

  k.snacks = o.snacks.slice(); k.extras = JSON.parse(JSON.stringify(o.extras)); k.precioEspecial = o.precioEspecial;
  k.clausulas = Object.assign({}, o.clausulas); k.datos = Object.assign({}, o.datos);
  empezar(k);

}
function pdfHist(id){

    else toast("Se descargó el PDF de " + k.folio + ".");

}

function exportar(){
  const datos = { app: "OBE! mix · contratos", version: 1, exportado: new Date().toISOString(), ultimoFolio: ultimoFolio, clausulas: PRED, contratos: HIST };
  descargarArchivo(new Blob([JSON.stringify(datos, null, 1)], { type: "application/json" }), "respaldo-contratos-obemix-" + hoyISO() + ".json");

/* Junta por folio: si ya existe, se queda el más reciente; nunca se duplica */

  obj.contratos.forEach(o => {
    const n = normalizarContrato(o); if (!n) return;
    const i = HIST.findIndex(h => h.folio === n.folio);
    if (i < 0) { if (HIST.some(h => h.id === n.id)) n.id = nuevoId(); HIST.push(n); nuevos++; }
    else if (Date.parse(n.actualizado) > Date.parse(HIST[i].actualizado)) { n.id = HIST[i].id; HIST[i] = n; act++; }
  });
  ultimoFolio = Math.max(ultimoFolio, clampInt(obj.ultimoFolio, 0, 999999, 0), HIST.reduce((m, h) => Math.max(m, numFolio(h.folio)), 0));
  if (obj.clausulas && typeof obj.clausulas === "object") {
    const p = obj.clausulas;
    if (p.datos) Object.keys(DATOS_CLAUSULAS).forEach(d => { if (!(d in PRED.datos) && d in p.datos) PRED.datos[d] = DATOS_CLAUSULAS[d].tipo === "casilla" ? !!p.datos[d] : String(p.datos[d] || "").slice(0, 160); });
    if (p.activas) CLAUSULAS.forEach(cl => { if (cl.tipo !== "original" && !(cl.id in PRED.activas) && typeof p.activas[cl.id] === "boolean") PRED.activas[cl.id] = p.activas[cl.id]; });
    guardarPred();
  }

  if (!K.generado && HIST.some(h => h.folio === K.folio)) { K.folio = siguienteFolio(); guardarActual(); }
  renderInicio();
  const partes = [];
  if (nuevos) partes.push(plural(nuevos, "contrato nuevo", "contratos nuevos"));
  if (act) partes.push(plural(act, "contrato actualizado", "contratos actualizados"));
  toast(partes.length ? "Respaldo cargado: " + listaY(partes) + "." : "Respaldo revisado: no había contratos nuevos.");
}

function irA(v, push){

function quitarPunto(clave){

  K.deCotizacion = K.deCotizacion.filter(x => x !== clave && x !== base && !(clave === "snacks" && x === "snacks"));

function fijarInvitados(n, avisar){
  n = Math.round(Number(n));
  if (!isFinite(n) || n <= 0) { K.evento.invitados = null; msgInv = ""; return; }
  if (n < REGLAS.minInvitados) { msgInv = avisar ? "El mínimo es " + REGLAS.minInvitados + " invitados; lo ajustamos." : ""; n = REGLAS.minInvitados; }

function alClic(e){

    case "variante": K.datos.varianteCancel = v; PRED.datos.varianteCancel = v; guardarPred(); delete errCl.cancelacion; cambio(true); break;
    case "casilla": K.datos[v] = !K.datos[v]; PRED.datos[v] = K.datos[v]; guardarPred(); cambio(true); break;

function alEscribir(e){
